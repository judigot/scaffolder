events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # WebSocket support - dynamically set Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Laravel (commented out - not a golden app yet)
    # upstream laravel {
    #     server laravel:80;
    # }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M;

        # Laravel (commented out - not a golden app yet)
        # location = /laravel {
        #     return 301 $scheme://$http_host/laravel/;
        # }
        # location /laravel/ {
        #     proxy_pass http://laravel/;
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-Forwarded-Host $http_host;
        #     proxy_set_header X-Forwarded-Port $server_port;
        #     proxy_redirect / /laravel/;
        # }

        # Golden apps (auto-generated from .golden files)
        include /etc/nginx/golden-apps.conf;

        location / {
            return 404;
        }
    }
}
