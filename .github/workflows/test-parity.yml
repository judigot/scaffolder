name: Test Parity

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'src/tests/introspectParity.test.ts'

jobs:
  parity:
    name: Introspection Parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DATABASE: scaffolder
      DB_USERNAME: scaffolder
      DB_PASSWORD: scaffolder123
      POSTGRESQL_PORT: 15432
      MYSQL_PORT: 13306
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Wait for databases
        run: bun ./scripts/wait-for-databases.ts

      - name: Run parity test
        run: bun test src/tests/introspectParity.test.ts --bail
