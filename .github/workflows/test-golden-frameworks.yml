name: Golden Frameworks

# TEMPORARY — restore after same-PR update feature lands.
# GitHub Actions CI is paused on push to main as well.
# Vercel production deploys stay enabled via vercel.json (`main: true`).
# Restore `on.push` and drop `if: false` when CI is turned back on.
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-frameworks:
    name: Golden Frameworks
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install

      - name: Run golden frameworks API tests
        timeout-minutes: 35
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 15432
          DB_USER: scaffolder
          DB_PASS: scaffolder123
        run: ./scripts/test-golden-frameworks
