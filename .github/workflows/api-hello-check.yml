name: API Hello Check

on:
  push: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: api
  VITE_BACKEND_PORT: 3000
  NODE_ENV: production

jobs:
  test-hello:
    name: Test /api/hello with ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node.js
            start: bunx tsx src/index.ts
          - runtime: Bun
            start: bun src/index.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Setup Node.js
        if: matrix.runtime == 'Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Start API server
        run: |
          ${{ matrix.start }} > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/hello
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/hello > /tmp/hello.json; then
              cat /tmp/hello.json
              python3 -c "import json; body=json.load(open('/tmp/hello.json')); assert body.get('message') == 'Hello, world!', body"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "=== server.log ==="
          cat server.log || true
          exit 1

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
