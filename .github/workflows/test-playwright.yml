name: Test (Playwright)

# TEMPORARY — restore after same-PR update feature lands.
# Do not run Playwright / e2e on feature-branch / pull-request pushes.
# Still gates production via push to main and workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test-playwright:
    name: Test (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_DATABASE: scaffolder
      DB_USERNAME: scaffolder
      DB_PASSWORD: scaffolder123
      POSTGRESQL_PORT: 15432
      MYSQL_PORT: 13306
      DATABASE_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      POSTGRES_TEST_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      MYSQL_TEST_URL: mysql://root:scaffolder123@localhost:13306/scaffolder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Wait for Postgres & MySQL
        run: bun ./scripts/wait-for-databases.ts

      - name: Run Playwright tests
        run: bun run test:playwright
