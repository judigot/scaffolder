name: API Hello Main Deployment

# Wait for this main-branch Vercel deployment, then GET /api/hello.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  deployment-from-wait:
    name: Smoke-test main Vercel deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test preview resolver behavior
        run: sh scripts/wait-for-vercel-preview.test.sh

      - name: Test API hello checker
        run: sh scripts/check-api-hello.test.sh

      - name: Find Vercel deployment for this commit
        id: deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          # Observed Git-triggered deployments can take over eleven minutes.
          VERCEL_PREVIEW_TIMEOUT_SECONDS: 1200
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh scripts/wait-for-vercel-preview.sh

      - name: GET /api/hello on the preview URL
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.deployment_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: sh scripts/check-api-hello.sh "$PREVIEW_URL"
