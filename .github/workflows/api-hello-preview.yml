name: API Hello Preview

# Wait for this commit's Vercel Preview, then GET /api/hello.
# No repository_dispatch here: that job only skipped on PRs.
on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  preview-from-wait:
    name: Smoke-test this commit's Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test preview resolver behavior
        run: sh scripts/wait-for-vercel-preview.test.sh

      - name: Test API hello checker
        run: sh scripts/check-api-hello.test.sh

      - name: Find Vercel preview for this commit
        id: deployment
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Observed Git-triggered deployments can take over eleven minutes.
          VERCEL_PREVIEW_TIMEOUT_SECONDS: 1200
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh scripts/wait-for-vercel-preview.sh

      - name: GET /api/hello on the preview URL
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.deployment_url }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/check-api-hello.sh "$PREVIEW_URL"
