name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          lint=false
          tests=false
          api=false

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              src/*|files/*|scripts/*|apps/*|packages/*|package.json|bun.lock|bunfig.toml|tsconfig*.json|vite.config.*|vitest.config.*|eslint.config.*|biome.json*|oxlint.json*|.github/workflows/pr-ci.yml)
                lint=true
                ;;
            esac

            case "$path" in
              src/*|scripts/*|package.json|bun.lock|bunfig.toml|tsconfig*.json|vitest.config.*|vitest.setup.*|bun-test-setup.*)
                tests=true
                ;;
            esac

            case "$path" in
              src/index.ts|src/app/*|api/*|package.json|bun.lock|bunfig.toml|tsconfig*.json)
                api=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          printf 'lint=%s\n' "$lint" >> "$GITHUB_OUTPUT"
          printf 'tests=%s\n' "$tests" >> "$GITHUB_OUTPUT"
          printf 'api=%s\n' "$api" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Template lint
        run: bun run lint:templates

  bun:
    name: Test (Bun)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      POSTGRES_TEST_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      MYSQL_TEST_URL: mysql://root:scaffolder123@localhost:13306/scaffolder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for databases
        run: bun ./scripts/wait-for-databases.ts

      - name: Run Bun tests
        run: bun test

  vitest:
    name: Test (Vitest)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      POSTGRES_TEST_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      MYSQL_TEST_URL: mysql://root:scaffolder123@localhost:13306/scaffolder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for databases
        run: bun ./scripts/wait-for-databases.ts

      - name: Run Vitest
        run: bun vitest

  api-hello:
    name: API hello (${{ matrix.runtime }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node.js
            start: node api/index.js
          - runtime: Bun
            start: bun src/index.ts
    env:
      VITE_API_URL: api
      VITE_BACKEND_PORT: 3000
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Setup Node.js
        if: matrix.runtime == 'Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API for Node.js
        if: matrix.runtime == 'Node.js'
        run: bun run build:bun

      - name: Start API server
        run: |
          ${{ matrix.start }} > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for /api/hello
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/hello > /tmp/hello.json; then
              cat /tmp/hello.json
              python3 -c "import json; body=json.load(open('/tmp/hello.json')); assert body.get('message') == 'Hello, world!', body"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          cat server.log || true
          exit 1

      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

  gate:
    name: PR Gate
    if: always()
    needs:
      - changes
      - lint
      - bun
      - vitest
      - api-hello
    runs-on: ubuntu-latest
    steps:
      - name: Require fast PR checks
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          if ! printf '%s' "$RESULTS" |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null; then
            printf '%s\n' "$RESULTS" | jq .
            exit 1
          fi
