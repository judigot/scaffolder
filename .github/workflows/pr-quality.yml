name: PR Quality Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Align npm & pnpm versions
        run: |
          npm install -g npm@11.6.2 pnpm@10.28.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: bun run lint

  template-lint:
    name: Template Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Align npm & pnpm versions
        run: |
          npm install -g npm@11.6.2 pnpm@10.28.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Run template lint
        run: bun run lint:templates

  golden-tests:
    name: Golden Tests (Fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Align npm & pnpm versions
        run: |
          npm install -g npm@11.6.2 pnpm@10.28.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Run golden schema tests
        run: |
          bun test src/tests/golden-projects/schema-comparison.test.ts
          bun test src/tests/golden-projects/orm-schema-parity.test.ts
          bun test src/tests/golden-projects/database-schema.test.ts

  db-parity:
    name: Database Parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Align npm & pnpm versions
        run: |
          npm install -g npm@11.6.2 pnpm@10.28.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Run parity test
        run: bun test src/tests/introspectParity.test.ts

  hono-react-runtime:
    name: Hono-react Runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app123
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app123@localhost:5432/app
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Align npm & pnpm versions
        run: |
          npm install -g npm@11.6.2 pnpm@10.28.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install scaffolder dependencies
        run: bun install

      - name: Generate hono-react golden app
        run: bun run scripts/generate-golden-apps.ts . hono-react

      - name: Install hono-react dependencies
        working-directory: .apps/hono-react
        run: bun install

      - name: Push database migrations
        working-directory: .apps/hono-react
        run: bun drizzle-kit push

      - name: Start hono-react API server
        working-directory: .apps/hono-react
        env:
          PORT: 3000
        run: |
          nohup bun run dev:api > server.log 2>&1 &
          echo $! > .server.pid
          sleep 3

      - name: Wait for server
        working-directory: .apps/hono-react
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server failed to start"
          echo "=== Server log ==="
          cat server.log || echo "No server log found"
          echo "=== Process check ==="
          ps aux | grep -E "bun|node" || echo "No bun/node process"
          exit 1

      - name: Run API tests
        working-directory: .apps/hono-react
        run: bash api-test.sh

      - name: Stop dev server
        if: always()
        working-directory: .apps/hono-react
        run: |
          if [ -f .server.pid ]; then
            kill $(cat .server.pid) 2>/dev/null || true
          fi
