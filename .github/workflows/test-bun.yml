name: Test (Bun)

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test-bun:
    name: Test (Bun)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      POSTGRES_TEST_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      MYSQL_TEST_URL: mysql://root:scaffolder123@localhost:13306/scaffolder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres & MySQL
        run: bun ./scripts/wait-for-databases.ts

      - name: Run test suite
        run: bun test

      - name: Run generated API E2E suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 15432
          DB_USER: scaffolder
          DB_PASS: scaffolder123
        run: ./scripts/run-generated-api-e2e.sh
