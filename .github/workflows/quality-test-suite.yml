name: Quality Test Suite

on:
  push: {}
  workflow_dispatch: {}

jobs:
  quality:
    name: Quality Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app123
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app123@localhost:5432/app
      POSTGRES_TEST_URL: postgresql://app:app123@localhost:5432/app
      MYSQL_TEST_URL: mysql://scaffolder:scaffolder123@localhost:13306/scaffolder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Template lint
        run: bun run lint:templates

      - name: Run test suite
        run: bun vitest run
