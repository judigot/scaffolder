name: Test (Playwright)

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test-end-to-end-playwright:
    name: Test (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      POSTGRES_TEST_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      MYSQL_TEST_URL: mysql://root:scaffolder123@localhost:13306/scaffolder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Run Playwright tests
        run: bun playwright test
