name: Lint

# TEMPORARY — restore after same-PR update feature lands.
# Do not run lint on feature-branch / pull-request pushes.
# Still gates production via push to main and workflow_dispatch.
# TEMPORARY — skip ESLint on pull-request / feature-branch pushes (too slow).
# Restore `bun run lint` (includes lint:eslint) later. ESLint remains in the repo.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      # TEMPORARY — do not invoke `bun run lint` / `lint:eslint` on PRs (too slow).
      # Keep tsc / biome / oxlint. Restore eslint via `bun run lint` later.
      - name: Lint
        run: bun run lint:tsc && bun run lint:biome && bun run lint:oxlint

      - name: ESLint
        if: github.ref == 'refs/heads/main'
        run: bun run lint:eslint

      - name: Template lint
        run: bun run lint:templates
