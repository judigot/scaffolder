name: Lint

# TEMPORARY — restore after same-PR update feature lands.
# Do not run lint on feature-branch / pull-request pushes.
# Still gates production via push to main and workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Template lint
        run: bun run lint:templates
