name: Lint

# TEMPORARY — restore after same-PR update feature lands.
# GitHub Actions CI is paused on push to main as well (includes ESLint).
# Vercel production deploys stay enabled via vercel.json (`main: true`).
# Restore `on.push` and drop `if: false` when CI is turned back on.
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Template lint
        run: bun run lint:templates
