name: Test (Vitest)

# TEMPORARY — restore after same-PR update feature lands.
# GitHub Actions CI is paused on push to main as well.
# Vercel production deploys stay enabled via vercel.json (`main: true`).
# Restore `on.push` and drop `if: false` when CI is turned back on.
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-vitest:
    name: Test (Vitest)
    if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scaffolder
          POSTGRES_PASSWORD: scaffolder123
          POSTGRES_DB: scaffolder
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scaffolder123
          MYSQL_DATABASE: scaffolder
          MYSQL_USER: scaffolder
          MYSQL_PASSWORD: scaffolder123
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      POSTGRES_TEST_URL: postgresql://scaffolder:scaffolder123@localhost:15432/scaffolder
      MYSQL_TEST_URL: mysql://root:scaffolder123@localhost:13306/scaffolder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres & MySQL
        run: bun ./scripts/wait-for-databases.ts

      - name: Run test suite
        run: bun vitest
