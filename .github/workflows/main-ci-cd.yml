name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: main-ci-cd
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: scaffolder
    steps:
      - name: Wait for required CI checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          required_checks=(
            "Lint"
            "Test (Bun)"
            "Test (Vitest)"
            "Test (Playwright)"
            "Golden Frameworks"
            "Test /api/hello with Node.js"
            "Test /api/hello with Bun"
          )

          deadline=$((SECONDS + 3600))

          while :; do
            checks_json="$(
              curl -fsS \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100"
            )"

            all_passed=1

            for check_name in "${required_checks[@]}"; do
              check_json="$(
                printf '%s' "$checks_json" |
                  jq -c --arg name "$check_name" '
                    [.check_runs[] | select(.name == $name)]
                    | sort_by(.started_at // "")
                    | last // empty
                  '
              )"

              if [ -z "$check_json" ]; then
                printf '%s\n' "Waiting for $check_name: not created yet"
                all_passed=0
                continue
              fi

              status="$(printf '%s' "$check_json" | jq -r '.status')"
              conclusion="$(printf '%s' "$check_json" | jq -r '.conclusion // ""')"

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                printf '%s\n' "Passed: $check_name"
                continue
              fi

              if [ "$status" = "completed" ]; then
                echo "::error::$check_name completed with conclusion '$conclusion'. Production deployment is blocked."
                exit 1
              fi

              printf '%s\n' "Waiting for $check_name: $status"
              all_passed=0
            done

            if [ "$all_passed" -eq 1 ]; then
              printf '%s\n' "All required CI checks passed."
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for required CI checks."
              exit 1
            fi

            sleep 10
          done

      - name: Confirm latest main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_main_sha="$(
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" |
              jq -r '.object.sha'
          )"

          if [ "$latest_main_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::This run is stale. main is now $latest_main_sha."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Discover Vercel project
        shell: bash
        run: |
          set -euo pipefail

          : "${VERCEL_TOKEN:?VERCEL_TOKEN repository secret is required}"

          teams_json="$(
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              https://api.vercel.com/v2/teams
          )"

          team_count="$(printf '%s' "$teams_json" | jq '.teams | length')"
          if [ "$team_count" -ne 1 ]; then
            echo "::error::Expected VERCEL_TOKEN to access exactly one Vercel team, found $team_count."
            exit 1
          fi

          team_id="$(printf '%s' "$teams_json" | jq -r '.teams[0].id')"

          project_json="$(
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$team_id"
          )"

          project_id="$(printf '%s' "$project_json" | jq -r '.id // empty')"
          org_id="$(printf '%s' "$project_json" | jq -r '.accountId // empty')"

          if [ -z "$project_id" ] || [ -z "$org_id" ]; then
            echo "::error::Could not resolve Vercel project '$VERCEL_PROJECT_NAME'."
            exit 1
          fi

          printf 'VERCEL_PROJECT_ID=%s\n' "$project_id" >> "$GITHUB_ENV"
          printf 'VERCEL_ORG_ID=%s\n' "$org_id" >> "$GITHUB_ENV"

          echo "Resolved Vercel project '$VERCEL_PROJECT_NAME'."

      - name: Pull Vercel production settings
        run: bunx vercel@59.23.2 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: bunx vercel@59.23.2 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(bunx vercel@59.23.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"

          case "$deployment_url" in
            https://*.vercel.app)
              ;;
            *)
              echo "::error::Unexpected Vercel deployment URL: $deployment_url"
              exit 1
              ;;
          esac

          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "Production deployment: $deployment_url"

      - name: Verify production /api/hello
        env:
          DEPLOYMENT_URL: ${{ steps.production.outputs.deployment_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: sh scripts/check-api-hello.sh "$DEPLOYMENT_URL"
