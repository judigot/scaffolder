services:
  postgresql:
    image: postgres:16
    ports:
      - '${POSTGRESQL_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - scaffolder_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

  mysql:
    image: mysql:8.0
    ports:
      - '${MYSQL_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - scaffolder_network
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.apps/laravel:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - laravel_node_modules:/var/www/html/node_modules
    environment:
      NGINX_PORT: ${NGINX_PORT}
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:${NGINX_PORT}/laravel
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - scaffolder_network
    depends_on:
      postgresql:
        condition: service_healthy
    working_dir: /var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - '${NGINX_PORT}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx.golden.conf:/etc/nginx/golden-apps.conf:ro
    networks:
      - scaffolder_network
    depends_on:
      - laravel

volumes:
  postgresql_data:
  mysql_data:
  laravel_vendor:
  laravel_node_modules:

networks:
  scaffolder_network:
    driver: bridge
