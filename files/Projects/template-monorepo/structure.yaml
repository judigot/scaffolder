# Bun Turborepo golden: Nest.js API + path-aware FILE_LOOP CRUD.
# $BASE is the author default skeleton (bundled Core). Request template_repo
# overrides it with a pinned tarball. Merge cannot delete; replace: strips
# live Hono apps/api before Nest lands. Omit $BASE + template_repo → today's
# /Core/template-monorepo first core.

$BASE: /Core/template-monorepo
replace:
  - apps/api/**

$USE_CORE:
  - /Core/template-monorepo
  - /Core/nestjs-api
  - /Core/drizzle-data-apps-api
  - /Core/playwright-e2e

apps:
  api:
    src:
      CREATE_FILE(app.module.ts --template ./templates/app-module.txt):
      db:
        CREATE_FILE(schema.ts --template ./templates/db-schema.txt --data-source=/Constants/typeMappings.yaml):
        CREATE_FILE(seed.ts --template ./templates/db-seed.txt):
      modules:
        FILE_LOOP(<@@>tableName.camelCase</@@>.controller.ts --template ./templates/controller.txt --data-source=/Constants/typeMappings.yaml):
        FILE_LOOP(<@@>tableName.camelCase</@@>.service.ts --template ./templates/service.txt):
        FILE_LOOP(<@@>tableName.camelCase</@@>.module.ts --template ./templates/module.txt):
    test:
      FILE_LOOP(<@@>tableName.camelCase</@@>.test.ts --template ./templates/test-crud.txt --filter="hasCompositePrimaryKey() NOT EQUAL 'true'"):

CREATE_FILE(api-test.sh --template ./templates/api-test.txt):
CREATE_FILE(Dockerfile.dev --template ./templates/Dockerfile.dev):
