# Next.js 16 App Router BFF (Vercel-first).
# Drizzle on the server via /Core/drizzle-data. Pages Router is not used.
# Auth: Better Auth via /Core/better-auth; Next overlays last so catch-all and tsc hold.

$SCHEMA_FILTER:
  - 'user'
  - 'session'
  - 'user.id.data_type=uuid'
  - 'session.userId.foreign_key'

$USE_CORE:
  - /Core/drizzle-data
  - /Core/better-auth
  - /Core/nextjs

api:
  db:
    CREATE_FILE(schema.ts --template ./templates/db-schema.txt --data-source=/Constants/typeMappings.yaml):
    CREATE_FILE(seed.ts --template ./templates/db-seed.txt):

app:
  api:
    FOLDER_LOOP(<@@>tableName.kebabCase</@@>):
      CREATE_FILE(route.ts --scoped --template ./templates/collection-route.txt):
      '[id]':
        CREATE_FILE(route.ts --scoped --template ./templates/item-route.txt):

lib:
  CREATE_FILE(auth.ts --template ./templates/auth-session.txt):

CREATE_FILE(api-test.sh --template ./templates/api-test.txt):
CREATE_FILE(Dockerfile.dev --template ./templates/Dockerfile.dev):
CREATE_FILE(README.md --template ./templates/readme.txt):
